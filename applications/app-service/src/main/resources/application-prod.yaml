server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: "FranchiseApp"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  r2dbc:
    initialization-mode: "never"
  sql:
    init:
      mode: "always"
      platform: "postgres"
      schema-locations: "classpath:schema.sql"

springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"

adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:franchise_db}
    schema: ${DB_SCHEMA:franchise_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
      base-path: "/actuator"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
